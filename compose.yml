name: cv

services:
  codex:
    image: ghcr.io/meowpow-png/mipe-runtime-codex-web:latest
    volumes:
      - codex-home:/home/dev/web/.codex
      - .:/workspace:z
    stdin_open: true
    tty: true

  claude:
    image: ghcr.io/meowpow-png/mipe-runtime-claude-web:latest
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN
    volumes:
      - claude-home:/home/dev/web
      - .:/workspace:z
    stdin_open: true
    tty: true

  playwright:
    build:
      context: .
      dockerfile: docker/playwright/Dockerfile
    volumes:
      - .:/workspace:z
    stdin_open: true
    tty: true

volumes:
  codex-home:
  claude-home:
